<!doctypehtml>
  <html lang="en">
    <meta charset="UTF-8">
    <title>SummerGrid.com | Documentation</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: Inter, sans-serif;
        margin: 0;
        height: 100vh;
        color: #111;
        background-color: #eee
      }

      div#bar {
        display: inline-flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-content: center;
        justify-content: flex-start;
        align-items: center;
        min-width: 300px;
        border-right-width: 1px;
        border-right-style: solid;
        border-right-color: #dcdcdc;
        height: 100%;
        overflow-y: auto
      }

      div#content {
        display: inline-flex;
        flex-direction: column;
        flex-wrap: nowrap;
        align-content: center;
        justify-content: flex-start;
        align-items: center;
        height: 100%;
        width: 100%;
        overflow-y: auto;
        padding: 20px;
        box-sizing: border-box
      }

      div#app {
        display: flex;
        flex-direction: row;
        flex-wrap: nowrap;
        align-content: flex-start;
        justify-content: flex-start;
        align-items: center;
        height: 100%;
        width: 100%
      }

      span#content-empty-message {
        margin-top: 236px;
        user-select: none;
        color: #8d8d8d;
        font-size: 17px;
        align-self: center
      }

      input#searchBar {
        width: 78%;
        font-size: 16px;
        background: 0 0;
        border-width: 1px;
        border-style: solid;
        border-color: #7f7f7f;
        padding: 7px;
        color: #111
      }

      input#searchBar:focus {
        outline: 0;
        border-color: #222
      }

      #barLogo {
        height: 53px;
        margin-top: 20px;
        user-select: none;
        margin-bottom: 20px
      }

      .loader {
        width: 21px;
        padding: 8px;
        aspect-ratio: 1;
        border-radius: 50%;
        background: #38b0e7;
        --_m: conic-gradient(#0000 10%, #000), linear-gradient(#000 0 0) content-box;
        -webkit-mask: var(--_m);
        mask: var(--_m);
        -webkit-mask-composite: source-out;
        mask-composite: subtract;
        animation: l3 1s infinite linear
      }

      @keyframes l3 {
        to {
          transform: rotate(1turn)
        }
      }

      #barTreeViewLoader {
        margin-top: 20px
      }

      span#errorMessage {
        position: relative;
        top: 21px;
        font-weight: 300;
        font-size: 15px;
        color: #b90000;
        display: none
      }

      div#barTreeView {
        display: flex;
        flex-direction: column;
        flex-wrap: nowrap;
        width: 100%;
        align-content: center;
        justify-content: flex-start;
        list-style: none;
        align-items: center
      }

      div[data-name=docs] {
        display: none
      }

      .tree-list {
        list-style: none
      }

      #docList {
        width: 100%
      }

      .tree-list {
        list-style: none;
        padding-left: 15px;
        margin: 0;
        margin-top: 10px
      }

      div[data-name] {
        transition: .2s;
        color: #444;
        padding: 2px 6px;
        font-size: 14px;
        width: calc(100% - 8px);
        box-sizing: border-box;
        margin-bottom: 5px
      }

      div[data-path] {
        border-left-width: 2px;
        border-left-style: solid;
        color: #111;
        cursor: pointer;
        transition: .2s;
        padding: 2px 6px;
        border-left-color: #a7a7a7;
        width: calc(100% - 8px);
        box-sizing: border-box;
        margin-bottom: 5px;
        font-size: 16px
      }

      div[data-path]:hover {
        border-left-color: #19b1ff;
        border-left-width: 5px
      }

      div[data-path].active {
        border-left-width: 6px;
        border-left-color: #ff6b35
      }

      #content h2,
      #content h3,
      #content h4,
      #content h5,
      #content h6 {
        color: #3b3b3b;
        margin: 5px
      }

      #content h1 {
        color: #000
      }

      div#content {
        color: #222;
        font-weight: 400
      }

      #content a[href] {
        color: #11635c;
        font-weight: 500
      }

      #content img {
        border-radius: 5px
      }

      div#content>div:first-child {
        max-width: 800px
      }
    </style>
    <div id="app">
      <div id="bar"><img alt="SummerGrid.com logo" id="barLogo" loading="eager" src="https://cloudflare-cdn.summergrid.com/marketing/logos/original/optimized/Logo%20%28Small%29.png" title="Logo"><input autocomplete="off" autofocus id="searchBar" oninput="updateSearch(this.value)" placeholder="Search...">
        <div id="barTreeView">
          <div id="barTreeViewLoader" class="loader"></div><span id="errorMessage"></span>
          <div id="docList"></div>
        </div>
      </div>
      <div id="content"><span id="content-empty-message">Loading...</span></div>
    </div>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const owner = 'SummerGrid';
        const repo = 'docs.summergrid.com';
        const branch = 'Live';
        const apiUrl = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
        const rawContentBaseUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/`;
        const treeEl = document.getElementById('docList');
        const errorEl = document.getElementById('errorMessage');
        const contentEl = document.getElementById('content');
        const contentEmptyMessageEl = document.getElementById('content-empty-message');
        async function loadContent(path, clickedElement, preventUrlUpdate = false) {
          contentEl.innerHTML = '<div class="loader" style="margin-top: 236px; align-self: center;"></div>';
          document.querySelectorAll('.doc-link').forEach(el => el.classList.remove('active'));
          try {
            const response = await fetch(rawContentBaseUrl + path);
            if (!response.ok) {
              throw new Error(`Failed to load content. Status: ${response.status}`);
            }
            const htmlContent = await response.text();
            contentEl.innerHTML = htmlContent;
            let activeElement = clickedElement;
            if (!activeElement) {
              activeElement = document.querySelector(`.doc-link[data-path="${path}"]`);
            }
            if (activeElement) {
              activeElement.classList.add('active');
            }
            if (!preventUrlUpdate) {
              const hashPath = path.replace('docs/', '').replace('.html', '');
              window.location.hash = hashPath;
            }
          } catch (error) {
            console.error('Content loading error:', error);
            contentEl.innerHTML = '<span id="content-error-message" style="color: #b90000; margin-top: 236px; align-self: center;">Oooops! Failed to load document. Try refreshing?</span>';
          }
        }

        function buildTree(treeData) {
          const root = {
            children: {}
          };
          treeData.forEach(item => {
            if (item.path) {
              if (item.path.startsWith('docs/')) {
                const parts = item.path.split('/');
                let currentNode = root;
                let fullPath = '';
                parts.forEach((part, index) => {
                  fullPath += (fullPath ? '/' : '') + part;
                  if (!currentNode.children[part]) {
                    currentNode.children[part] = {
                      type: index === parts.length - 1 && item.type === 'blob' ? 'blob' : 'tree',
                      name: part,
                      path: fullPath
                    };
                    if (currentNode.children[part].type === 'tree') {
                      currentNode.children[part].children = {};
                    }
                  }
                  if (currentNode.children[part].type === 'tree') {
                    currentNode = currentNode.children[part];
                  }
                });
              }
            }
          });
          return root;
        }

        function renderTree(treeNode) {
          if (!treeNode.children || Object.keys(treeNode.children).length === 0) {
            return null;
          }
          const ul = document.createElement('ul');
          ul.className = 'tree-list';
          const sortedKeys = Object.keys(treeNode.children).sort((a, b) => {
            const nodeA = treeNode.children[a];
            const nodeB = treeNode.children[b];
            if (nodeA.type === 'tree' && nodeB.type === 'blob') return 1;
            if (nodeA.type === 'blob' && nodeB.type === 'tree') return -1;
            return a.localeCompare(b);
          });
          sortedKeys.forEach(key => {
            const node = treeNode.children[key];
            const li = document.createElement('li');
            const itemClass = node.type === 'tree' ? 'folder-closed' : 'file-item';
            li.className = `tree-item ${itemClass}`;
            const content = document.createElement('div');
            content.setAttribute('data-name', node.name);
            if (node.type === 'blob' && node.name.endsWith('.html')) {
              content.setAttribute('data-path', node.path);
              content.classList.add('doc-link');
            }
            content.innerHTML = `${node.name.replace('.html', '')}`;
            li.appendChild(content);
            if (node.type === 'tree') {
              const childrenUl = renderTree(node);
              if (childrenUl) {
                li.appendChild(childrenUl);
              }
            }
            ul.appendChild(li);
          });
          return ul;
        }

        function handleUrlHash() {
          const hash = window.location.hash.substring(1);
          if (hash) {
            const path = `docs/${hash}.html`;
            loadContent(path, null, true);
            return true;
          }
          return false;
        }

        function setupContentLoaders() {
          document.querySelectorAll('.doc-link[data-path]').forEach(link => {
            link.addEventListener('click', function() {
              const path = this.getAttribute('data-path');
              if (path) {
                loadContent(path, this);
              }
            });
          });
        }
        fetch(apiUrl).then(response => {
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }
          return response.json();
        }).then(data => {
          document.getElementById('barTreeViewLoader').style.display = 'none';
          if (data.tree) {
            const hierarchicalTree = buildTree(data.tree);
            const renderedTree = renderTree(hierarchicalTree);
            if (renderedTree) {
              treeEl.appendChild(renderedTree);
              setupContentLoaders();
              const contentLoadedFromHash = handleUrlHash();
              if (!contentLoadedFromHash) {
                const defaultLink = document.querySelector('.doc-link[data-path="docs/Welcome.html"]');
                if (defaultLink) {
                  loadContent('docs/Welcome.html', defaultLink);
                } else {
                  contentEmptyMessageEl.textContent = 'Select a document from the left to view its content!';
                }
              }
            } else {
              treeEl.innerHTML = `The repository tree appears to be empty.`;
              contentEmptyMessageEl.textContent = 'No documents found.';
            }
            treeEl.style.display = 'block';
          } else {
            throw new Error("API response error.");
          }
        }).catch(error => {
          console.error('Fetch error:', error);
          errorEl.textContent = `Error loading file list: ${error.message}`;
          errorEl.style.display = 'block';
          document.getElementById('barTreeViewLoader').style.display = 'none';
          contentEmptyMessageEl.textContent = 'Could not load documentation list.';
        });
        searchBar.addEventListener('keydown', function(event) {
          if (event.key === 'Enter') {
            event.preventDefault();
            const firstVisibleLink = document.querySelector('.doc-link:not([style*="display: none"])');
            if (firstVisibleLink) {
              firstVisibleLink.click();
              searchBar.blur();
            }
          }
        });
      });

      function updateSearch(value) {
        const searchTerm = value.toLowerCase().trim();
        const docLinks = document.querySelectorAll('.doc-link');
        docLinks.forEach(link => {
          const text = link.textContent.toLowerCase();
          const listItem = link.closest('li');
          if (searchTerm === '' || text.includes(searchTerm)) {
            if (listItem) {
              listItem.style.display = '';
            }
          } else {
            if (listItem) {
              listItem.style.display = 'none';
            }
          }
        });
      }
    </script>
